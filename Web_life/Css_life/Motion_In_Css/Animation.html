    <title>Document</title>
     <style>
        .{

            animation-delay: 2s ;

            /* animation-direction: alternate; */
            /* animation-direction: alternate-reverse; */
            /* animation-fill-mode:forwards; */
              animation-fill-mode: backwards;
            /* animation-fill-mode: both;  */
        
        }
        @keyframes spiderman {
            /* from{
                transform: translate(0px,0px);

             from{

             }

</head>

</body>
</html>
