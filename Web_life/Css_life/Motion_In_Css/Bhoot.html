<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    .{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        body{
            height: 100vh;
            width: 100vw;
            display: flex;
            background-color: black;
            justify-content: center;
            align-items: center;
        }
        .mainBox{
            width: 350px;
            height: 350px;
            border: 2px solid white;
            position: relative;
            border-radius: 50%;
            animation-name: spiderman;
            animation-duration: 5s;
            box-shadow: 2px 1px 2px 2px white;
            animation: spiderman 3s linear infinite;
        }
        .childBox{
            width: 70px;
            height: 70px;
            position: absolute;
            top: 35px;
            border-radius: 50%;
            background-color: orange;
            box-shadow: 3px 2px 10px 3px rgb(187, 84, 6);
            


        }
        @keyframes spiderman {
            0%{
                transform: rotate(0deg);
            }
            100%{
                transform: rotate(360deg);
            }
            
        }
        </style>
</head>
<body>
    <div class="mainBox">
        <div class="childBox"></div>
    </div>
</body>
</html>
