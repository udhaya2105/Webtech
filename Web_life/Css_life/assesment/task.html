<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            width: 600px;
            height: 500px;
            border: 5px solid blue;
            position:relative;
        }
        .box{
            width: 100px;
            height: 100px;
            border: 2px red solid;
        }
        #box1{
            position: relative;
            
        }
        #box2{
            position: absolute;
            right: 0px;
            top: 0px;
        }
        #box3{
            position: absolute;
            left: 250px ;
            top: 200px;
        }
        #box4{
            position: absolute;
            bottom: 0px;
            left: 0px;
        }
        #box5{
            position: absolute;
            right: 0px;
            bottom: 0px;   
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box" id="box1">box1</div>
        <div class="box" id="box2">box2</div>
        <div class="box" id="box3">box3</div>
        <div class="box" id="box4">box4</div>
        <div class="box" id="box5">box5</div>
        </div>
</body>
</html>
