<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent{
            width: 800px;
            height: 700px;
            border: 5px solid black;
            position:relative;
        }
        .box{
            width: 100px;
            height: 100px;
            border: 2px red solid;
        }
        #box6{
            position: relative;
        }
        #box7{
            position: absolute;
            top:0px;
            right:0px;
        }
        #box8{
            position: absolute;
            bottom: 0px;
            left:0px;
        }
        #box9{
            position: absolute;
            bottom: 0px;
            right: 0px;
        }
         .child{
            width: 600px;
            height: 400px;
            border:5px solid black;
            position:absolute;
            top:150px;
            left:100px;
        } 
         .box{
            width: 100px;
            height: 100px;
            border: 2px red solid;
        }
        #box1{
            position: absolute;
            top:0px;
            left:250px;
        }
        #box2{
            position: absolute;
            top:150px;
        }
        #box3{
            position: absolute;
            bottom: 0px;
            left:250px;
        }
        #box4{
            position: absolute;
            top:150px;
            right:0px;
        }
        #box5{
            position: absolute;
            top:150px;
            left:250px;
        }

    </style>
</head>
<body>
    <div class="parent">
        <div class="box" id="box6">box6</div>
        <div class="box" id="box7">box7</div>
        <div class="box" id="box8">box8</div>
        <div class="box" id="box9">box9</div>
        <div class="child">
            <div class="box" id="box1">box1</div>
            <div class="box" id="box2">box2</div>
            <div class="box" id="box3">box3</div>
            <div class="box" id="box4">box4</div>
            <div class="box" id="box5">box5</div>
        </div>
    </div>
</body>

</html>
