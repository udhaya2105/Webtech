<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            height: 400vh;
            width: 100vw;
        
          }
        #box1{
            background: cornflowerblue no-repeat;
        }
        .box{
        width: 250px;
        height: 50px;
        position: fixed;
        bottom: 50px;
        right: 100px;
        border: 2px solid black;
        background-color:blue;
        text-indent: 50px;
      }
      img{
        height: 60px;
        width: 50px;
        position: fixed;
        bottom: 50px;
        right: 40px;
      } 
        .child{
            height: 100vh;
            border: 1px solid;
        }
        #box2{
            height: 200vh;
        }
        #box3{
            background: rgb(108, 141, 201) no-repeat;
        }
        .chat{
            height: 80px;
            width: 80px;
            position: sticky;
            top: 150px;
            background-color: red;
            border: 1px solid red;
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="child" id="box1"><div class="box"><h2>Welcome😊</h2></div></div>
        <img src="https://i.pinimg.com/originals/3b/e2/f4/3be2f445535301ebc8d739576ce8b36d.gif">
        <div class="child" id="box2">
            <div class="chat"></div>
        </div>
        <div class="child" id="box3"></div>
    </div>
</body>
</html>
