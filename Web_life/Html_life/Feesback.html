<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>My Feedback Form</h1>
    <ul type="disc">
        <li><label for="name">Name:</label>
            <input name="Uname" id="name" type="text" placeholder="Enter your name">
        </li>
        <li><label for="email">Email:</label>
            <input name="Uemail" id="email" type="text" placeholder="Enter your email">
        </li>
        <li><label for="Password">Password:</label>
            <input name="Password" id="Password" type="text" placeholder="Enter Password">
        </li>
        <li>Please check all the emotions that apply to you: </li>
        <ul type="disc">
            <li>
                <label>Angry</label>
                <input name="Angry" type="checkbox">
            </li>
            <li><label>Sad</label>
                <input name="Sad" type="checkbox">
            </li>
            <li><label>Happy</label>
                <input name="Happy" type="checkbox">
            </li>
            <li><label>Ambivalent</label>
                <input name="Ambivalent" type="checkbox">
            </li>
        </ul>
        <li>How satisfied were you with our services?</li>
        <ul type="disc">
            <li><label>Very Satisfied</label>
                <input name="Very Satisfied" type="radio">
            </li>
            <li><label>Satisfied</label>
                <input name="Satisfied" type="radio">
            </li>
            <li><label>Don't Care</label>
                <input name="Don't Care" type="radio">
            </li>
            <li><label>Disatisfied</label>
                <input name="Disatisfied" type="radio">
            </li>
            <li><label>Very Disatisfied</label>
                <input name="Very Disatisfied" type="radio">
            </li>
        </ul>
        <li><label for="comments">Further Comments:</label>
            <textarea name="Ucomments" id="comments" rows="4" cols="30"></textarea>
        </li>
        <li><label for="photo">Bio Photo:</label>
            <input name="Uphoto" id="photo" type="file">
        </li>
        <li><label for="location">Location Visited:</label>
            <input name="Ulocation" id="location" type="">
        </li>

    </ul>
    <button>Submit</button>
</body>

</html>
